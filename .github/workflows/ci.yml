name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate D1 schema
        run: npx wrangler d1 execute frequencia-itb --local --file=src/schema.sql

  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLCipher build dependency
        run: choco install openssl -y --no-progress
      - run: flutter pub get
      - run: flutter build windows --debug

